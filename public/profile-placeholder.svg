<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b5c"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a192f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>
  <rect width="400" height="400" rx="24" fill="url(#glowGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="300" x2="400" y2="300" />
  </g>

  <!-- Circular Avatar Frame -->
  <g transform="translate(200, 170)">
    <!-- Outer Glow Ring -->
    <circle r="92" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 6"/>
    <!-- Middle Ring -->
    <circle r="84" fill="#0f172a" stroke="#2563eb" stroke-width="3"/>
    
    <!-- Stylized Professional Silhouette Head & Shoulders -->
    <clipPath id="avatarClip">
      <circle r="82"/>
    </clipPath>
    <g clip-path="url(#avatarClip)">
      <rect x="-82" y="-82" width="164" height="164" fill="#0d2144"/>
      <!-- Head -->
      <circle cx="0" cy="-14" r="34" fill="#cbd5e1"/>
      <!-- Neck -->
      <rect x="-10" y="16" width="20" height="16" fill="#94a3b8"/>
      <!-- Shoulders / Blazer -->
      <path d="M-62 76 C-50 36, -24 30, 0 30 C24 30, 50 36, 62 76 Z" fill="#1e293b"/>
      <!-- Shirt Collar -->
      <path d="M-18 30 L0 54 L18 30 Z" fill="#ffffff"/>
      <path d="M-4 54 L0 76 L4 54 Z" fill="#2563eb"/>
    </g>
  </g>

  <!-- Monogram Pill / Badge -->
  <g transform="translate(200, 290)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.25))"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#0a192f" text-anchor="middle" letter-spacing="1.5">
      MANYASHREE GP
    </text>
  </g>

  <!-- Subtitle Text -->
  <text x="200" y="345" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="12" fill="#93c5fd" text-anchor="middle" letter-spacing="0.5">
    SOFTWARE ENGINEER • FULL STACK
  </text>
  <text x="200" y="365" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="11" fill="#64748b" text-anchor="middle">
    SIH 2025 Team Leader
  </text>
</svg>
